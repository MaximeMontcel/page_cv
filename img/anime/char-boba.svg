" y="62.5" width="9" height="2.2" fill="#55585f" transform="rotate(19 32 63.6)"/><ellipse cx="46.8" cy="77" rx="5.8" ry="5.2" fill="#3a2d22"/><g class="muzzle"><circle cx="20.5" cy="65.4" r="4.2" fill="#ffd34d"/><circle cx="20.5" cy="65.4" r="2" fill="#fff"/></g><line class="boltP" x1="16" y1="63.6" x2="7" y2="60" stroke="#ff4040" stroke-width="2.4" stroke-linecap="round"/></g></g></svg>