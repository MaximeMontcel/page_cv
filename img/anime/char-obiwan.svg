<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 90" role="img" aria-label="Obi-Wan Kenobi"><style>.tw{animation:tw 3.6s ease-in-out infinite}@keyframes tw{50%{opacity:.2}}
