<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 90" role="img" aria-label="C-3PO"><style>.tw{animation:tw 3.6s ease-in-out infinite}@keyframes tw{50%{opacity:.2}}
.bob{animation:bob 3.4s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-1.3px)}}
.blink{transform-box:fill-box;transform-origin:center;animation:blink 5s infinite}@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.glow{animation:glow 1.3s ease-in-out infinite}@keyframes glow{50%{opacity:.72}}
.pulse{animation:pulse 4s ease-in-out infinite}@keyframes pulse{50%{opacity:.55}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}.head{transform-origin:80px 38px;animation:tilt 4.4s ease-in-out infinite}@keyframes tilt{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(5deg)}}
.eye{animation:eye 2.6s ease-in-out infinite}@keyframes eye{50%{opacity:.55}}
.ra{transform-origin:96px 47px;animation:wave 3.4s ease-in-out infinite}@keyframes wave{0%,100%{transform:rotate(-20deg)}50%{transform:rotate(-120deg)}60%{transform:rotate(-100deg)}70%{transform:rotate(-125deg)}}
.la{transform-origin:64px 47px;animation:la 3.4s ease-in-out infinite}@keyframes la{50%{transform:rotate(8deg)}}</style><defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a1a0c"/><stop offset="1" stop-color="#6a4a22"/></linearGradient><linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#a57a1f"/><stop offset=".45" stop-color="#f6d070"/><stop offset="1" stop-color="#a57a1f"/></linearGradient></defs>
