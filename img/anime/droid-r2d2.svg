.glow{animation:glow 1.3s ease-in-out infinite}@keyframes glow{50%{opacity:.72}}
.pulse{animation:pulse 4s ease-in-out infinite}@keyframes pulse{50%{opacity:.55}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}.rock{transform-origin:80px 86px;animation:rock 3s ease-in-out infinite}@keyframes rock{25%{transform:rotate(-2.5deg)}75%{transform:rotate(2.5deg)}}
.scan{animation:scan 5s ease-in-out infinite}@keyframes scan{0%,100%{transform:translateX(-7px)}50%{transform:translateX(7px)}}
.led{animation:led 1.2s steps(1) infinite}@keyframes led{50%{opacity:.15}}
.beep{opacity:0;animation:beep 3s ease-out infinite}.b2{animation-delay:-1s}@keyframes beep{0%{opacity:0;transform:translate(0,0)}20%{opacity:1}100%{opacity:0;transform:translate(8px,-10px)}}</style><defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0d1c3a"/><stop offset="1" stop-color="#2a4a7a"/></linearGradient><clipPath id="dome"><path d="M57.5 41 Q57.5 16 80 16 Q102.5 16 102.5 41Z"/></clipPath></defs>
