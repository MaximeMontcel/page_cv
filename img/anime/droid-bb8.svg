<circle cx="80" cy="64" r="21" fill="#f4f3ef"/>
<g clip-path="url(#ball)"><g class="roll"><circle cx="80" cy="64" r="9" fill="none" stroke="#e8792a" stroke-width="3"/><circle cx="80" cy="64" r="4" fill="#c9ccd1"/>
<circle cx="80" cy="40" r="9" fill="none" stroke="#e8792a" stroke-width="3"/><circle cx="80" cy="88" r="9" fill="none" stroke="#e8792a" stroke-width="3"/><circle cx="56" cy="64" r="9" fill="none" stroke="#e8792a" stroke-width="3"/><circle cx="104" cy="64" r="9" fill="none" stroke="#e8792a" stroke-width="3"/>
