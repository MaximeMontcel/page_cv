<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 90" role="img" aria-label="BB-8"><style>.tw{animation:tw 3.6s ease-in-out infinite}@keyframes tw{50%{opacity:.2}}
.bob{animation:bob 3.4s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-1.3px)}}
.blink{transform-box:fill-box;transform-origin:center;animation:blink 5s infinite}@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.glow{animation:glow 1.3s ease-in-out infinite}@keyframes glow{50%{opacity:.72}}
.pulse{animation:pulse 4s ease-in-out infinite}@keyframes pulse{50%{opacity:.55}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}.roll{transform-origin:80px 64px;animation:roll 6s linear infinite}@keyframes roll{to{transform:rotate(360deg)}}
.headw{transform-origin:80px 44px;animation:hw 3s ease-in-out infinite}@keyframes hw{0%,100%{transform:rotate(-9deg)}50%{transform:rotate(9deg)}}
.move{animation:mv 6s ease-in-out infinite}@keyframes mv{50%{transform:translateX(6px)}}
.led{animation:led 1.6s steps(1) infinite}@keyframes led{50%{opacity:.2}}</style><defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a1f12"/><stop offset=".65" stop-color="#c46a2a"/><stop offset="1" stop-color="#e3a25a"/></linearGradient><clipPath id="ball"><circle cx="80" cy="64" r="21"/></clipPath></defs>
