<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 90" role="img" aria-label="Din Djarin"><style>.tw{animation:tw 3.6s ease-in-out infinite}@keyframes tw{50%{opacity:.2}}
.bob{animation:bob 3.4s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-1.3px)}}
.blink{transform-box:fill-box;transform-origin:center;animation:blink 5s infinite}@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.glow{animation:glow 1.3s ease-in-out infinite}@keyframes glow{50%{opacity:.72}}
.pulse{animation:pulse 4s ease-in-out infinite}@keyframes pulse{50%{opacity:.55}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}.breath{animation:breath 4s ease-in-out infinite}@keyframes breath{50%{transform:translateY(-.9px)}}
.head{transform-origin:80px 62px;animation:tilt 6.5s ease-in-out infinite}@keyframes tilt{0%,100%{transform:rotate(-1.6deg)}50%{transform:rotate(1.8deg)}}
.look{animation:look 7s ease-in-out infinite}@keyframes look{0%,38%,100%{transform:translateX(0)}48%,66%{transform:translateX(.9px)}76%,88%{transform:translateX(-.8px)}}
.blinkP{transform-origin:80px 40px;animation:blinkP 5.5s infinite}@keyframes blinkP{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.08)}}
.hum{animation:hum 1.4s ease-in-out infinite}@keyframes hum{50%{opacity:.72}}
.swing{transform-origin:113px 78px;animation:swing 5.2s ease-in-out infinite}@keyframes swing{0%,58%,100%{transform:rotate(0)}68%{transform:rotate(-16deg)}78%{transform:rotate(7deg)}88%{transform:rotate(0)}}
.recoil{transform-origin:47px 77px;animation:recoil 3.2s ease-in-out infinite}@keyframes recoil{0%,44%,62%,100%{transform:rotate(0)}50%{transform:rotate(-7deg)}}
.muzzle{opacity:0;animation:muzzle 3.2s infinite}@keyframes muzzle{0%,46%,56%,100%{opacity:0}50%{opacity:1}}
.boltP{opacity:0;animation:boltP 3.2s linear infinite}@keyframes boltP{0%,47%{opacity:0;transform:translate(0,0)}50%{opacity:1}78%{opacity:0;transform:translate(-62px,-26px)}100%{opacity:0}}
.zapP{animation:zapP 1.5s steps(1) infinite}.z2{animation-delay:-.5s}@keyframes zapP{0%,45%,100%{opacity:0}10%,30%{opacity:1}20%{opacity:.35}}
.ripP{transform-box:fill-box;transform-origin:center;animation:ripP 2.2s ease-out infinite}.r2{animation-delay:-1.1s}@keyframes ripP{from{transform:scale(.4);opacity:.9}to{transform:scale(3);opacity:0}}
.wave{transform-origin:44px 84px;animation:wave 2.6s ease-in-out infinite}@keyframes wave{0%,100%{transform:rotate(0)}25%{transform:rotate(-12deg)}50%{transform:rotate(4deg)}75%{transform:rotate(-10deg)}}
.capeP{transform-origin:80px 66px;animation:capeP 5s ease-in-out infinite}@keyframes capeP{50%{transform:skewX(-2deg)}}
.roarP{transform-box:fill-box;transform-origin:center top;animation:roarP 4.2s ease-in-out infinite}@keyframes roarP{0%,58%,100%{transform:scaleY(.25)}68%,84%{transform:scaleY(1)}}
.earL{transform-origin:67px 42px;animation:earL 3.4s ease-in-out infinite}@keyframes earL{50%{transform:rotate(5deg)}}
.earR{transform-origin:93px 42px;animation:earR 3.4s ease-in-out infinite}@keyframes earR{50%{transform:rotate(-5deg)}}
.glintP{opacity:.15;animation:glintP 4.5s ease-in-out infinite}@keyframes glintP{50%{opacity:.8}}
.led{animation:led 1.4s steps(1) infinite}@keyframes led{50%{opacity:.2}}
.evil{animation:evil 2.4s ease-in-out infinite}@keyframes evil{50%{opacity:.4}}
