6.6 66.2 l.6 -4 M49 67.4 l1.6 -3.2" stroke="#9cc27a" stroke-width="1.9" stroke-linecap="round"/><circle class="ripP" cx="40" cy="60" r="4" fill="none" stroke="#9fd8ff" stroke-width="1"/><circle class="ripP r2" cx="40" cy="60" r="4" fill="none" stroke="#9fd8ff" stroke-width="1"/></g></svg>